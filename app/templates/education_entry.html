<div class="education-item">
    <h3>{{ entry.school }}</h3>
    <p class="education-meta">{{ entry.location }}</p>
    <p class="education-program">{{ entry.program }}</p>
    <p class="education-dates">{{ entry.dates }}</p>
    <ul class="education-highlights">
        {% for highlight in entry.highlights %}
        <li>{{ highlight }}</li>
        {% endfor %}
    </ul>
</div>
